# Optional /collect wiring for the be service. Use together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.collect.yml up -d be
#
# Why a separate file: both mounts below are host paths that only exist on a
# host that runs collection (site-status CSVs from dev-flow, the runner's
# state directory). A bind of a missing host path in docker-compose.yml would
# either fail `be` on every other install or make Docker create an empty
# root-owned directory there, so the default file keeps COLLECT_STATUS_DIR
# empty (/collect/sites then answers status_source.reason="not_configured").
services:
  be:
    environment:
      COLLECT_STATUS_DIR: /data/collect-status
      # The runner writes its token to RUNNER_HOME/.token on first start. Reading
      # it from there avoids copying the secret into .env.
      # (COLLECT_RUNNER_TOKEN, if set, still takes precedence.)
      COLLECT_RUNNER_TOKEN_FILE: /run/collect-runner/token
      # 설정 → API 키 (delivery/be/api_keys.py): provider keys are written here as <provider>.env.
      API_KEYS_DIR: /data/api-keys
    volumes:
      # Directory holding the site-status *.csv files (site_id,state,detail,updated_at,...).
      - ${COLLECT_STATUS_HOST_DIR:?set COLLECT_STATUS_HOST_DIR to the site-status directory}:/data/collect-status:ro
      # Only the token file, read-only (not the whole runner state). It is a
      # plain host-file bind: runner-state is backed by COLLECT_RUNNER_HOME on
      # the host. create_host_path=false: if the runner has not created .token
      # yet, be fails to start instead of Docker creating a *directory* named
      # .token (which would then stop the runner from writing its token).
      # Start the runner once first (`--profile runner up -d runner`).
      # be runs as root, so the runner's 0600 token file is readable.
      - type: bind
        source: ${COLLECT_RUNNER_HOME:-/srv/collect-runner}/.token
        target: /run/collect-runner/token
        read_only: true
        bind:
          create_host_path: false
      # The collectors' secrets folder (the env files run-pilot.sh / the runner pass as ENUM_ENV_FILE),
      # read-write so a key that passed its test can be saved. be runs as root and gives each file
      # the folder owner's uid/gid, mode 600, as the runner's env_file_refusal requires. It must not
      # be inside the runs root or the plans folder (both are mounted into collection containers).
      # create_host_path=false: a missing folder fails be instead of Docker creating a root-owned one.
      # Before the first `up` with this file, on the host (as the runner user):
      #   mkdir -m 700 -p "$COLLECT_RUNNER_HOME/secrets"   # or set API_KEYS_HOST_DIR
      - type: bind
        source: ${API_KEYS_HOST_DIR:-${COLLECT_RUNNER_HOME:-/srv/collect-runner}/secrets}
        target: /data/api-keys
        bind:
          create_host_path: false
