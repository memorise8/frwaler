name: libertree-delivery

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-libertree}
      # Compose interpolates this whole file for any targeted build/config
      # (e.g. `docker compose build fe`), even when postgres isn't touched.
      # A required (`:?`) reference here would hard-fail those unrelated
      # commands, so we default to empty and rely on the official postgres
      # entrypoint, which independently refuses to start when
      # POSTGRES_PASSWORD is unset/empty and POSTGRES_HOST_AUTH_METHOD is
      # not "trust" (see docker-entrypoint.sh: docker_verify_minimum_env).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-libertree}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-libertree} -d ${POSTGRES_DB:-libertree}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Fails fast with a clear, self-describing message when POSTGRES_PASSWORD
  # is unset, before migrate/be/worker ever open a connection with it.
  #
  # Why this exists: `postgres.environment.POSTGRES_PASSWORD` defaults to
  # empty (see above) so that Compose's whole-file interpolation doesn't
  # hard-fail unrelated commands like `docker compose build fe`. On a
  # *fresh* volume, the official postgres entrypoint still refuses to
  # start when the password is unset/empty — that failure is already
  # clear. But on an *already-initialised* volume, postgres starts fine
  # (the password lives in the database, not the env var), and
  # migrate/be/worker would silently receive a DSN with no password and
  # die with an opaque authentication error that never mentions
  # POSTGRES_PASSWORD. This guard runs before them and names the real
  # cause instead. It reuses the postgres:16 image already pulled for the
  # `postgres` service purely for its shell — it never touches the
  # database.
  postgres-password-guard:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -z "$$POSTGRES_PASSWORD" ]; then
          echo "POSTGRES_PASSWORD is not set. migrate/be/worker cannot authenticate to postgres." >&2
          echo "Set POSTGRES_PASSWORD in delivery/.env -- see delivery/README.md for setup." >&2
          exit 1
        fi
    restart: "no"

  migrate:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: delivery/Dockerfile.be
    command: ["python", "-m", "delivery.be.migrate"]
    environment:
      LIBERTREE_PG_DSN: postgresql://${POSTGRES_USER:-libertree}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-libertree}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-password-guard:
        condition: service_completed_successfully
    restart: "no"

  be:
    build:
      context: ..
      dockerfile: delivery/Dockerfile.be
    environment:
      LIBERTREE_PG_DSN: postgresql://${POSTGRES_USER:-libertree}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-libertree}
      LIBERTREE_DB_BACKEND: postgres
      LIBERTREE_BLOB_ROOT: /data/blob
      DELIVERY_AUTH_MODE: ${DELIVERY_AUTH_MODE:-token}
      DELIVERY_API_TOKEN: ${DELIVERY_API_TOKEN:-}
      DELIVERY_DB_POOL_MIN: ${DELIVERY_DB_POOL_MIN:-1}
      DELIVERY_DB_POOL_MAX: ${DELIVERY_DB_POOL_MAX:-10}
      DELIVERY_AGGREGATE_CACHE_SECONDS: ${DELIVERY_AGGREGATE_CACHE_SECONDS:-30}
      TRANSLATION_INTERNAL_MODEL: ${TRANSLATION_INTERNAL_MODEL:-}
      TRANSLATION_EXTERNAL_MODEL: ${TRANSLATION_EXTERNAL_MODEL:-}
    volumes:
      - blob:/data/blob
    ports:
      - "127.0.0.1:${BE_PORT:-8080}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-password-guard:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: &delivery-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  fe:
    build:
      context: ..
      dockerfile: delivery/Dockerfile.fe
    environment:
      BE_URL: http://be:3001
      DELIVERY_API_TOKEN: ${DELIVERY_API_TOKEN:-}
      TRANSLATION_INTERNAL_MODEL: ${TRANSLATION_INTERNAL_MODEL:-}
    ports:
      - "127.0.0.1:${FE_PORT:-3000}:3002"
    depends_on:
      be:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3002/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *delivery-logging

  worker:
    build:
      context: ..
      dockerfile: delivery/Dockerfile.worker
    environment:
      LIBERTREE_PG_DSN: postgresql://${POSTGRES_USER:-libertree}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-libertree}
      LIBERTREE_DB_BACKEND: postgres
      LIBERTREE_BLOB_ROOT: /data/blob
      TRANSLATION_EXTERNAL_ENDPOINT: ${TRANSLATION_EXTERNAL_ENDPOINT:-}
      TRANSLATION_EXTERNAL_MODEL: ${TRANSLATION_EXTERNAL_MODEL:-}
      TRANSLATION_EXTERNAL_API_KEY: ${TRANSLATION_EXTERNAL_API_KEY:-}
      TRANSLATION_INTERNAL_ENDPOINT: ${TRANSLATION_INTERNAL_ENDPOINT:-}
      TRANSLATION_INTERNAL_MODEL: ${TRANSLATION_INTERNAL_MODEL:-}
      TRANSLATION_WORKER_ID: ${TRANSLATION_WORKER_ID:-delivery-worker-1}
    volumes:
      - blob:/data/blob
    depends_on:
      postgres:
        condition: service_healthy
      postgres-password-guard:
        condition: service_completed_successfully
    # Schema changes are explicit (`docker compose --profile tools run --rm migrate`).
    # A missing migration makes both BE readiness and Worker startup fail visibly.
    restart: on-failure:5
    logging: *delivery-logging

volumes:
  pgdata:
  blob:
