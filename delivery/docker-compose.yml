name: libertree-delivery

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-libertree}
      # Compose interpolates this whole file for any targeted build/config
      # (e.g. `docker compose build fe`), even when postgres isn't touched.
      # A required (`:?`) reference here would hard-fail those unrelated
      # commands, so we default to empty and rely on the official postgres
      # entrypoint, which independently refuses to start when
      # POSTGRES_PASSWORD is unset/empty and POSTGRES_HOST_AUTH_METHOD is
      # not "trust" (see docker-entrypoint.sh: docker_verify_minimum_env).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-libertree}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-libertree} -d ${POSTGRES_DB:-libertree}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Data store: must come back on its own after a host reboot or an
    # unexpected daemon restart, with no operator present to re-run `up`.
    restart: unless-stopped

  # Fails fast with a clear, self-describing message when POSTGRES_PASSWORD
  # is unset, before migrate/be/worker ever open a connection with it.
  #
  # Why this exists: `postgres.environment.POSTGRES_PASSWORD` defaults to
  # empty (see above) so that Compose's whole-file interpolation doesn't
  # hard-fail unrelated commands like `docker compose build fe`. On a
  # *fresh* volume, the official postgres entrypoint still refuses to
  # start when the password is unset/empty — that failure is already
  # clear. But on an *already-initialised* volume, postgres starts fine
  # (the password lives in the database, not the env var), and
  # migrate/be/worker would silently receive a DSN with no password and
  # die with an opaque authentication error that never mentions
  # POSTGRES_PASSWORD. This guard runs before them and names the real
  # cause instead. It reuses the postgres:16 image already pulled for the
  # `postgres` service purely for its shell — it never touches the
  # database.
  postgres-password-guard:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -z "$$POSTGRES_PASSWORD" ]; then
          echo "POSTGRES_PASSWORD is not set. migrate/be/worker cannot authenticate to postgres." >&2
          echo "Set POSTGRES_PASSWORD in delivery/.env -- see delivery/README.md for setup." >&2
          exit 1
        fi
    restart: "no"

  # In both "tools" (ad hoc schema changes against an already-running stack)
  # and "bootstrap" (first-run setup) profiles: same one-shot job, two
  # entry points. Neither profile is enabled by default, so `docker compose
  # up -d` on its own never touches this service or the schema.
  #
  # Why `be` does NOT `depends_on: migrate` to sequence this automatically:
  # verified empirically (see delivery/README.md and the compose report)
  # that when a service depends on another service whose only profiles are
  # not currently active, Compose refuses to resolve the project at all
  # ("service X depends on undefined service migrate") -- even for `docker
  # compose up -d` with no --profile flag, which must keep working
  # unchanged on an already-migrated database. A depends_on edge here would
  # therefore break the default path, not just gate the bootstrap one. The
  # migration is sequenced instead by running it to completion (`run --rm`
  # blocks until exit) before `up -d` is ever invoked -- see the "최초 실행"
  # section of the README for the exact two-step command.
  migrate:
    profiles: ["tools", "bootstrap"]
    build:
      context: ..
      dockerfile: delivery/Dockerfile.be
    command: ["python", "-m", "delivery.be.migrate"]
    environment:
      LIBERTREE_PG_DSN: postgresql://${POSTGRES_USER:-libertree}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-libertree}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-password-guard:
        condition: service_completed_successfully
    restart: "no"

  be:
    build:
      context: ..
      dockerfile: delivery/Dockerfile.be
    environment:
      LIBERTREE_PG_DSN: postgresql://${POSTGRES_USER:-libertree}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-libertree}
      LIBERTREE_DB_BACKEND: postgres
      LIBERTREE_BLOB_ROOT: /data/blob
      CANCER_FR_CATALOGUE_DES_PUBLIC_KEY: ${CANCER_FR_CATALOGUE_DES_PUBLIC_KEY:-}
      EDUCATION_GOVT_NZ_OUR_WORK_KEY: ${EDUCATION_GOVT_NZ_OUR_WORK_KEY:-}
      EDUCATION_GOVT_NZ_SEARCH_KEY: ${EDUCATION_GOVT_NZ_SEARCH_KEY:-}
      INRAE_FR_ACTUALITES_KEY: ${INRAE_FR_ACTUALITES_KEY:-}
      NKVTS_NO_ENGLISH_KEY: ${NKVTS_NO_ENGLISH_KEY:-}
      PHFSCIENCE_NZ_DIGITAL_LIBRARY_KEY: ${PHFSCIENCE_NZ_DIGITAL_LIBRARY_KEY:-}
      PHFSCIENCE_NZ_NEWS_PUBLICATIONS_KEY: ${PHFSCIENCE_NZ_NEWS_PUBLICATIONS_KEY:-}
      TRANSPARENCY_GOV_AU_PUBLICATIONS_KEY: ${TRANSPARENCY_GOV_AU_PUBLICATIONS_KEY:-}
      SCIENCEON_KEY: ${SCIENCEON_KEY:-}
      SCIENCEON_CLIENT_ID: ${SCIENCEON_CLIENT_ID:-}
      SCIENCEON_MAC_ADDRESS: ${SCIENCEON_MAC_ADDRESS:-}
      DELIVERY_AUTH_MODE: ${DELIVERY_AUTH_MODE:-token}
      DELIVERY_API_TOKEN: ${DELIVERY_API_TOKEN:-}
      DELIVERY_DB_POOL_MIN: ${DELIVERY_DB_POOL_MIN:-1}
      DELIVERY_DB_POOL_MAX: ${DELIVERY_DB_POOL_MAX:-10}
      DELIVERY_AGGREGATE_CACHE_SECONDS: ${DELIVERY_AGGREGATE_CACHE_SECONDS:-30}
      CRAWLER_HEALTH_REPORT_DIR: /data/health
      CRAWLER_HEALTH_STALE_HOURS: ${CRAWLER_HEALTH_STALE_HOURS:-48}
      TRANSLATION_INTERNAL_MODEL: ${TRANSLATION_INTERNAL_MODEL:-}
      TRANSLATION_EXTERNAL_MODEL: ${TRANSLATION_EXTERNAL_MODEL:-}
      # /collect API (delivery/be/collect.py). Without a token the routes answer
      # 503 runner_unconfigured and /collect/sites still shows judgments/counts.
      # COLLECT_STATUS_DIR is empty by default: the site-status bind lives in
      # docker-compose.collect.yml (see there for why it is not in this file).
      COLLECT_RUNNER_URL: ${COLLECT_RUNNER_URL:-http://runner:8793}
      COLLECT_RUNNER_TOKEN: ${COLLECT_RUNNER_TOKEN:-}
      COLLECT_RUNNER_TOKEN_FILE: ${COLLECT_RUNNER_TOKEN_FILE:-}
      COLLECT_STATUS_DIR: ${COLLECT_STATUS_DIR:-}
    # Lets COLLECT_RUNNER_URL=http://host.docker.internal:8793 reach a runner
    # installed on the host instead of the compose `runner` service. That host
    # runner must then listen on an address the bridge can reach (RUNNER_BIND),
    # not only its default 127.0.0.1. NEVER set RUNNER_BIND=0.0.0.0 on the host:
    # that exposes the runner (which can start containers) on every interface.
    # Bind it to the docker bridge gateway IP only (e.g. RUNNER_BIND=172.17.0.1,
    # see `docker network inspect bridge`) and firewall port 8793 from anything
    # but the docker bridge.
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - blob:/data/blob
      - health-reports:/data/health:ro
    ports:
      - "127.0.0.1:${BE_PORT:-8080}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-password-guard:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Must survive a host reboot / daemon restart unattended. This also
    # gives the bootstrap sequence a safety net: if `be` is ever started
    # before the schema exists, it fails closed (by design) and Compose
    # keeps retrying with backoff, so it converges on its own once
    # `migrate` has completed instead of staying dead.
    restart: unless-stopped
    logging: &delivery-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  fe:
    build:
      context: ..
      dockerfile: delivery/Dockerfile.fe
    environment:
      BE_URL: http://be:3001
      DELIVERY_API_TOKEN: ${DELIVERY_API_TOKEN:-}
      TRANSLATION_INTERNAL_MODEL: ${TRANSLATION_INTERNAL_MODEL:-}
    ports:
      - "127.0.0.1:${FE_PORT:-3000}:3002"
    depends_on:
      be:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3002/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Must survive a host reboot / daemon restart unattended, same as be.
    restart: unless-stopped
    logging: *delivery-logging

  worker:
    build:
      context: ..
      dockerfile: delivery/Dockerfile.worker
    environment:
      LIBERTREE_PG_DSN: postgresql://${POSTGRES_USER:-libertree}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-libertree}
      LIBERTREE_DB_BACKEND: postgres
      LIBERTREE_BLOB_ROOT: /data/blob
      TRANSLATION_EXTERNAL_ENDPOINT: ${TRANSLATION_EXTERNAL_ENDPOINT:-}
      TRANSLATION_EXTERNAL_MODEL: ${TRANSLATION_EXTERNAL_MODEL:-}
      TRANSLATION_EXTERNAL_API_KEY: ${TRANSLATION_EXTERNAL_API_KEY:-}
      TRANSLATION_INTERNAL_ENDPOINT: ${TRANSLATION_INTERNAL_ENDPOINT:-}
      TRANSLATION_INTERNAL_MODEL: ${TRANSLATION_INTERNAL_MODEL:-}
      TRANSLATION_WORKER_ID: ${TRANSLATION_WORKER_ID:-delivery-worker-1}
      LIBERTREE_MAX_WALL_S: ${LIBERTREE_MAX_WALL_S:-1500}
      CANCER_FR_CATALOGUE_DES_PUBLIC_KEY: ${CANCER_FR_CATALOGUE_DES_PUBLIC_KEY:-}
      EDUCATION_GOVT_NZ_OUR_WORK_KEY: ${EDUCATION_GOVT_NZ_OUR_WORK_KEY:-}
      EDUCATION_GOVT_NZ_SEARCH_KEY: ${EDUCATION_GOVT_NZ_SEARCH_KEY:-}
      INRAE_FR_ACTUALITES_KEY: ${INRAE_FR_ACTUALITES_KEY:-}
      NKVTS_NO_ENGLISH_KEY: ${NKVTS_NO_ENGLISH_KEY:-}
      PHFSCIENCE_NZ_DIGITAL_LIBRARY_KEY: ${PHFSCIENCE_NZ_DIGITAL_LIBRARY_KEY:-}
      PHFSCIENCE_NZ_NEWS_PUBLICATIONS_KEY: ${PHFSCIENCE_NZ_NEWS_PUBLICATIONS_KEY:-}
      TRANSPARENCY_GOV_AU_PUBLICATIONS_KEY: ${TRANSPARENCY_GOV_AU_PUBLICATIONS_KEY:-}
      SCIENCEON_KEY: ${SCIENCEON_KEY:-}
      SCIENCEON_CLIENT_ID: ${SCIENCEON_CLIENT_ID:-}
      SCIENCEON_MAC_ADDRESS: ${SCIENCEON_MAC_ADDRESS:-}
      SCIENCEON_TOKEN_CACHE: ${SCIENCEON_TOKEN_CACHE:-/data/runtime/scienceon_token.json}
      SCIENCEON_SLICE_BUDGET: ${SCIENCEON_SLICE_BUDGET:-4}
      SCIENCEON_INCREMENTAL_YEARS: ${SCIENCEON_INCREMENTAL_YEARS:-2}
      SCIENCEON_INCREMENTAL_PAGES: ${SCIENCEON_INCREMENTAL_PAGES:-3}
    volumes:
      - blob:/data/blob
      - runtime:/data/runtime
    depends_on:
      postgres:
        condition: service_healthy
      postgres-password-guard:
        condition: service_completed_successfully
    # Schema changes are explicit (`docker compose --profile tools run --rm migrate`,
    # or `--profile bootstrap` on first run). A missing migration makes both
    # BE readiness and Worker startup fail visibly.
    #
    # Restart policy: previously `on-failure:5`, which is why this worker sat
    # dead for hours on this host after exhausting its five retries -- once a
    # transient condition (e.g. postgres not yet ready, or racing the
    # bootstrap migration) outlasts five backoff attempts, `on-failure:N`
    # gives up permanently and nobody is watching an unattended delivery
    # host to notice. `unless-stopped` retries indefinitely with Docker's
    # built-in backoff (capped, and reset after it stays up) and also
    # restarts after a daemon/host restart, matching the other long-running
    # services. A worker that is genuinely broken (bad credentials, etc.)
    # will keep idling/retrying instead of vanishing -- visible in `docker
    # compose ps` and logs -- which is what an unattended package needs.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "delivery.health.worker_check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *delivery-logging

  file-worker:
    build:
      context: ..
      dockerfile: delivery/Dockerfile.worker
    command: ["python", "-m", "delivery.files.worker"]
    environment:
      LIBERTREE_PG_DSN: postgresql://${POSTGRES_USER:-libertree}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-libertree}
      LIBERTREE_DB_BACKEND: postgres
      LIBERTREE_BLOB_ROOT: /data/blob
      FILE_STAGE_TIMEOUT_SECONDS: ${FILE_STAGE_TIMEOUT_SECONDS:-180}
    volumes:
      - blob:/data/blob
    depends_on:
      postgres:
        condition: service_healthy
      postgres-password-guard:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-m", "delivery.files.check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *delivery-logging

  # Collect runner (deploy/collect-runner/runner.py) for the /collect API.
  # Only under the "runner" profile, so plain `docker compose up -d` is
  # unchanged:  docker compose --profile runner up -d runner
  #
  # SECURITY: the docker socket mount below gives this container
  # host-root-equivalent access (anything that can talk to the socket can
  # start a privileged container mounting /). That is why the runner only
  # accepts registered plans with fixed arguments, requires X-Runner-Token,
  # and is NOT published on any host port -- it is reachable only from this
  # compose network (be calls http://runner:8793). Do not add `ports:` here.
  #
  # Paths: run-pilot.sh asks the HOST docker daemon to bind-mount the run
  # folder, the registered plan files (under RUNNER_HOME) and the seed/reference
  # files, so those must have the same path inside this container as on the
  # host. Hence RUNNER_HOME and the runs root are mounted at identical paths
  # (COLLECT_RUNNER_HOME, COLLECT_RUNS_ROOT; create both on the host first).
  # Non-root: run-pilot.sh refuses uid 0 and requires the run folder to be
  # owned by the calling uid, so the runner runs as COLLECT_RUNNER_UID:GID and
  # joins the host docker socket's group (DOCKER_GID, `stat -c %g
  # /var/run/docker.sock`). Before the first start, on the host:
  #   mkdir -p "$COLLECT_RUNNER_HOME" "$COLLECT_RUNS_ROOT"
  #   chown "$COLLECT_RUNNER_UID:$COLLECT_RUNNER_GID" "$COLLECT_RUNNER_HOME" "$COLLECT_RUNS_ROOT"
  # (Joining the socket group is still host-root-equivalent; see SECURITY.)
  #
  # On first start the entrypoint copies delivery/collect-runner.config.json
  # into RUNNER_HOME/config.json; edit that copy (runs_root etc.) if you change
  # COLLECT_RUNS_ROOT. Register plans with
  #   docker compose exec runner runnerctl register --src /opt/frwaler-src ...
  runner:
    profiles: ["runner"]
    build:
      context: ..
      dockerfile: delivery/Dockerfile.runner
    user: "${COLLECT_RUNNER_UID:-1000}:${COLLECT_RUNNER_GID:-1000}"
    group_add: ["${DOCKER_GID:-999}"]
    environment:
      RUNNER_HOME: ${COLLECT_RUNNER_HOME:-/srv/collect-runner}
      # Safe here only because this service publishes no port (see SECURITY).
      RUNNER_BIND: 0.0.0.0
    volumes:
      - runner-state:${COLLECT_RUNNER_HOME:-/srv/collect-runner}
      - ${COLLECT_RUNS_ROOT:-/srv/enum-pilot-run}:${COLLECT_RUNS_ROOT:-/srv/enum-pilot-run}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    init: true
    logging: *delivery-logging

volumes:
  pgdata:
  blob:
  runtime:
  health-reports:
  # Runner state (registry, runner.sqlite, events.jsonl, logs, .token). A named
  # volume backed by a host directory at the SAME path it is mounted at in the
  # runner (see the runner service): the host daemon resolves plan paths
  # under RUNNER_HOME when run-pilot.sh bind-mounts them.
  # Docker stores driver_opts when the volume is first created: after changing
  # COLLECT_RUNNER_HOME, stop the runner and `docker volume rm
  # libertree-delivery_runner-state` so it is recreated with the new device
  # (the data stays in the old host directory; move it yourself).
  runner-state:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${COLLECT_RUNNER_HOME:-/srv/collect-runner}
