# Optional listing page 1 probe (delivery.health.plan_probe): every request goes
# through the collectors' governed Fetcher (robots.txt, LibertreeCollector UA,
# >= 1.5 s per host, no retry on 429/refusals). Rechecks every 48 hours.
# This service has no production DB credentials or blob mount. Its root
# filesystem is read-only.
#
# Plans: the collect runner's one-site plans (registry/plans/<site_id>.json),
# mounted read-only. To leave sites out, mount a CSV (site_id,reason) and add
# "--exclude-file", "/plans-exclude.csv" to the command.
#
# The /health page reads these results: be must mount the same health-reports
# volume read-only with CRAWLER_HEALTH_REPORT_DIR=/data/health (docker-compose.yml
# already does: health-reports:/data/health:ro).
services:
  health:
    profiles: ["health"]
    build:
      context: ..
      dockerfile: delivery/Dockerfile.worker
    command: ["python", "-m", "delivery.health.plan_probe", "--plans-dir", "/plans",
              "--report-dir", "/data/health", "--gate-dir", "/data/health/.request-gates",
              "--workers", "2", "--interval-hours", "48"]
    environment:
      CRAWLER_HEALTH_REPORT_DIR: /data/health
      CANCER_FR_CATALOGUE_DES_PUBLIC_KEY: ${CANCER_FR_CATALOGUE_DES_PUBLIC_KEY:-}
      EDUCATION_GOVT_NZ_OUR_WORK_KEY: ${EDUCATION_GOVT_NZ_OUR_WORK_KEY:-}
      EDUCATION_GOVT_NZ_SEARCH_KEY: ${EDUCATION_GOVT_NZ_SEARCH_KEY:-}
      INRAE_FR_ACTUALITES_KEY: ${INRAE_FR_ACTUALITES_KEY:-}
      NKVTS_NO_ENGLISH_KEY: ${NKVTS_NO_ENGLISH_KEY:-}
      PHFSCIENCE_NZ_DIGITAL_LIBRARY_KEY: ${PHFSCIENCE_NZ_DIGITAL_LIBRARY_KEY:-}
      PHFSCIENCE_NZ_NEWS_PUBLICATIONS_KEY: ${PHFSCIENCE_NZ_NEWS_PUBLICATIONS_KEY:-}
      TRANSPARENCY_GOV_AU_PUBLICATIONS_KEY: ${TRANSPARENCY_GOV_AU_PUBLICATIONS_KEY:-}
      SCIENCEON_KEY: ${SCIENCEON_KEY:-}
      SCIENCEON_CLIENT_ID: ${SCIENCEON_CLIENT_ID:-}
      SCIENCEON_MAC_ADDRESS: ${SCIENCEON_MAC_ADDRESS:-}
    volumes:
      - health-reports:/data/health
      - ${COLLECT_RUNNER_HOME:-/srv/collect-runner}/registry/plans:/plans:ro
    networks: [health-egress]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    init: true
    restart: unless-stopped

networks:
  health-egress:
