# Optional metadata probes. This service has no production DB credentials or
# blob mount. Its root filesystem is read-only; crawler scratch files expire.
services:
  health:
    profiles: ["health"]
    build:
      context: ..
      dockerfile: delivery/Dockerfile.worker
    command: ["python", "-m", "delivery.health.runner", "--all", "--interval", "86400"]
    environment:
      CRAWLER_HEALTH_REPORT_DIR: /data/health
      CANCER_FR_CATALOGUE_DES_PUBLIC_KEY: ${CANCER_FR_CATALOGUE_DES_PUBLIC_KEY:-}
      EDUCATION_GOVT_NZ_OUR_WORK_KEY: ${EDUCATION_GOVT_NZ_OUR_WORK_KEY:-}
      EDUCATION_GOVT_NZ_SEARCH_KEY: ${EDUCATION_GOVT_NZ_SEARCH_KEY:-}
      INRAE_FR_ACTUALITES_KEY: ${INRAE_FR_ACTUALITES_KEY:-}
      NKVTS_NO_ENGLISH_KEY: ${NKVTS_NO_ENGLISH_KEY:-}
      PHFSCIENCE_NZ_DIGITAL_LIBRARY_KEY: ${PHFSCIENCE_NZ_DIGITAL_LIBRARY_KEY:-}
      PHFSCIENCE_NZ_NEWS_PUBLICATIONS_KEY: ${PHFSCIENCE_NZ_NEWS_PUBLICATIONS_KEY:-}
      TRANSPARENCY_GOV_AU_PUBLICATIONS_KEY: ${TRANSPARENCY_GOV_AU_PUBLICATIONS_KEY:-}
      SCIENCEON_KEY: ${SCIENCEON_KEY:-}
      SCIENCEON_CLIENT_ID: ${SCIENCEON_CLIENT_ID:-}
      SCIENCEON_MAC_ADDRESS: ${SCIENCEON_MAC_ADDRESS:-}
    volumes:
      - health-reports:/data/health
    networks: [health-egress]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    init: true
    restart: unless-stopped

networks:
  health-egress:
