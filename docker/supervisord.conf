[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:finolaw]
directory=/app/finolaw
command=npx next start -p 3001 -H 0.0.0.0
autostart=true
autorestart=true
startretries=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PATH="/app/.venv/bin:/usr/local/bin:/usr/bin:/bin",NODE_ENV="production"

[program:scheduler]
; Nightly crawl→download→convert→summarize chain. The shell script
; sleeps until the next 03:00 (Asia/Seoul) and then runs once.
; To disable, run `supervisorctl stop scheduler` inside the container,
; or remove this block in your deploy fork.
directory=/app
command=bash /app/scripts/cron_crawl.sh loop
autostart=true
autorestart=true
startretries=3
stopwaitsecs=30
stdout_logfile=/app/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/app/logs/scheduler.err
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PATH="/app/.venv/bin:/usr/local/bin:/usr/bin:/bin",PYTHONUNBUFFERED="1"
