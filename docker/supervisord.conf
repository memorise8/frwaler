[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:finolaw]
directory=/app/finolaw
command=npx next start -p 3001 -H 0.0.0.0
autostart=true
autorestart=true
startretries=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PATH="/app/.venv/bin:/usr/local/bin:/usr/bin:/bin",NODE_ENV="production"
