<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DOC_TITLE}} | Libertree</title>
<style>
  :root{
    --ink:#202622; --muted:#5f6f74; --canvas:#ffffff; --wash:#f4f2ea;
    --accent:#365b42; --accent-soft:#e4ebe1; --rule:#d9d6cc;
    --good:#3f7350; --warn:#9a7524; --bad:#9e463b;
    --mono:"SF Mono",ui-monospace,Consolas,"D2Coding",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --space:1.5rem;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--wash);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.72;letter-spacing:-.003em}
  .page{max-width:860px;margin:0 auto;background:var(--canvas);
    padding:4rem 3.4rem 3.6rem;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  /* Document header */
  .doc-eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin:0 0 .6rem}
  h1{font-size:1.86rem;line-height:1.28;margin:0 0 1.4rem;font-weight:700;
    text-wrap:balance;border-bottom:3px solid var(--accent);padding-bottom:1rem}
  .doc-meta{width:100%;border-collapse:collapse;margin:0 0 2.6rem;font-size:.86rem}
  .doc-meta th,.doc-meta td{border:1px solid var(--rule);padding:.5rem .8rem;text-align:left}
  .doc-meta th{background:var(--wash);color:var(--muted);font-weight:600;white-space:nowrap;width:1%}
  /* Sections */
  h2{font-size:1.22rem;margin:2.8rem 0 .9rem;padding-top:1.2rem;font-weight:700;
    border-top:1px solid var(--rule)}
  h2 .num{color:var(--accent);font-variant-numeric:tabular-nums;margin-right:.5rem}
  h3{font-size:1.02rem;margin:1.8rem 0 .6rem;font-weight:700;color:#2c332e}
  p{margin:.7rem 0}
  ul,ol{margin:.7rem 0;padding-left:1.3rem}
  li{margin:.28rem 0}
  strong{font-weight:700}
  a{color:var(--accent)}
  code{font-family:var(--mono);font-size:.86em;background:var(--wash);
    padding:.1em .38em;border-radius:3px;border:1px solid var(--rule)}
  pre{font-family:var(--mono);font-size:.82rem;line-height:1.6;background:#1c211d;color:#e8ede6;
    padding:1rem 1.15rem;border-radius:5px;overflow-x:auto;margin:1rem 0}
  pre code{background:none;border:none;padding:0;color:inherit}
  /* Tables */
  .tbl-wrap{overflow-x:auto;margin:1.1rem 0}
  table.data{width:100%;border-collapse:collapse;font-size:.86rem}
  table.data th,table.data td{border:1px solid var(--rule);padding:.5rem .7rem;
    text-align:left;vertical-align:top}
  table.data th{background:var(--accent-soft);font-weight:700}
  table.data tr:nth-child(even) td{background:#faf9f5}
  table.data td.num{text-align:right;font-variant-numeric:tabular-nums}
  /* Callouts & status */
  .note{border-left:4px solid var(--accent);background:var(--accent-soft);
    padding:.8rem 1.1rem;margin:1.1rem 0;border-radius:0 4px 4px 0;font-size:.9rem}
  .note.warn{border-color:var(--warn);background:#f6efe0}
  .note.bad{border-color:var(--bad);background:#f6e6e3}
  .pill{display:inline-block;font-size:.74rem;font-weight:700;padding:.12em .6em;
    border-radius:999px;line-height:1.5;white-space:nowrap}
  .pill.good{background:#e2efe6;color:var(--good)}
  .pill.warn{background:#f6eed9;color:var(--warn)}
  .pill.bad{background:#f4e0dc;color:var(--bad)}
  /* Diagram boxes (for architecture) */
  .diagram{display:flex;flex-wrap:wrap;gap:.7rem;margin:1.2rem 0;font-size:.82rem}
  .diagram .box{border:1.5px solid var(--accent);border-radius:5px;padding:.7rem .9rem;
    background:#fff;min-width:140px}
  .diagram .box b{display:block;color:var(--accent);margin-bottom:.2rem}
  .placeholder{border:1.5px dashed var(--rule);border-radius:5px;padding:2rem;
    text-align:center;color:var(--muted);font-size:.85rem;margin:1.1rem 0;background:#fbfaf6}
  footer{margin-top:3.4rem;padding-top:1.2rem;border-top:1px solid var(--rule);
    font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
  /* Print */
  @media print{
    body{background:#fff;font-size:11pt}
    .page{max-width:none;margin:0;padding:0;box-shadow:none}
    h2{break-after:avoid}
    table.data,pre,.note,.diagram{break-inside:avoid}
    a{color:var(--ink);text-decoration:none}
    @page{margin:18mm 16mm}
  }
  @media(max-width:640px){.page{padding:2rem 1.2rem}}
</style>
</head>
<body>
<main class="page">
  <p class="doc-eyebrow">LIBERTREE · 산출물</p>
  <h1>{{DOC_TITLE}}</h1>
  <table class="doc-meta">
    <tr><th>문서번호</th><td>{{DOC_NO}}</td><th>버전</th><td>v1.0</td></tr>
    <tr><th>프로젝트</th><td>웹페이지 데이터 수집·분석·요약 서비스</td><th>작성일</th><td>2026-08-01</td></tr>
    <tr><th>작성자</th><td>공급자 (financenow)</td><th>이용자</th><td>libertree.co.kr</td></tr>
  </table>

  <!-- CONTENT START -->
  {{CONTENT}}
  <!-- CONTENT END -->

  <footer>
    <span>Libertree · 웹페이지 데이터 수집·분석·요약 서비스</span>
    <span>{{DOC_NO}} · 2026-08-01</span>
  </footer>
</main>
</body>
</html>
