            "description": "Updated by NDF staff on 7th September, 2026\nThrough the National Collaborative Research Infrastructure Strategy (NCRIS) program, Therapeutic Innovation Australia (TIA), Phenomics Australia, ANSTOs National Deuteration Facility (NDF), Bioplatforms Australia and Microscopy Australia support a network of national research infrastructure to address the medical products challenge in the 2021 National Research Infrastructure (NRI) Roadmap. We collectively offer academic researchers and SMEs access to a diverse range of Australian translational medical research capabilities, from the molecular basis of health and disease through to clinical trials.\nTo encourage access to these capabilities, TIA developed the Pipeline Accelerator, a competitive voucher-style scheme that can subsidise the cost of access to a full range of advanced capabilities. In this Pipeline Accelerator round (2026-27 Round 1), TIA is partnering with Phenomics Australia, the National Deuteration Facility (NDF), Bioplatforms Australia and Microscopy Australia to expand the list of translation expertise necessary for the discovery and translation of medical research.\nThe National Deuteration Facility (NDF) is accessible in this round as a primary Provider. Applicants may propose access to multiple scheme Providers in the one application to support the same project, noting to access a supplementary voucher from Bioplatforms Australia and Microscopy Australia, you must also apply for a TIA, Phenomics Australia and/or NDF voucher for the same project on the same application. \nApplicants should contact NDF as soon as possible (ndf-enquiries@ansto.gov.au) to discuss their project for a feasibility assessment of their request and to obtain a quote for the required service/s, which you will be required to provide in your application. The guidelines for the Pipeline Accelerator are available to download below. In the online application for NCRIS lead agent selection at Step 2, select National Deuteration Facility under \u0027Primary Voucher\u0027.  \nAccess modes to the NDF available outside of this scheme are through the NDF User Program.\nDownload PDF\nApplications for Pipeline Accelerator 2026-27 Round 1 open 7th September and close on 30th October 2026.  ",
