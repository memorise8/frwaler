# 선택: 수집 실행기를 compose 의 runner 컨테이너 대신 **호스트 프로세스**(~/collect-runner)로
# 돌리고, be 가 유닉스 소켓으로 붙는 방식. 호스트 방화벽이 컨테이너→호스트 TCP 를 막는 서버용
# (2026-10-20 교체한 운영 서버가 이 방식, ADMIN_GUIDE.md A-3·1-1).
#
# 사용: .env 에 COMPOSE_FILE=docker-compose.yml:docker-compose.runner-socket.yml
#       COLLECT_RUNNER_HOST_SOCKET_DIR=<호스트 runner 의 RUNNER_SOCKET 이 있는 폴더>
#       COLLECT_RUNNER_HOME=<호스트 runner 홈>  (be 가 그 .token 을 읽음; 또는 COLLECT_RUNNER_TOKEN 지정)
# 호스트 runner 기동(재시작할 때도 RUNNER_SOCKET 을 반드시 함께):
#   RUNNER_BIND=127.0.0.1 RUNNER_SOCKET=$HOME/collect-runner/sock/runner.sock ~/collect-runner/runnerctl ensure
# 소켓은 0660, 토큰(X-Runner-Token)은 그대로 필요합니다. be 는 컨테이너 root 라 소켓에 접속할 수 있습니다.
services:
  be:
    environment:
      COLLECT_RUNNER_SOCKET: /run/collect-runner-sock/${COLLECT_RUNNER_SOCKET_NAME:-runner.sock}
    volumes:
      - type: bind
        source: ${COLLECT_RUNNER_HOST_SOCKET_DIR:?set COLLECT_RUNNER_HOST_SOCKET_DIR to the host runner socket directory}
        target: /run/collect-runner-sock
        read_only: true
        bind:
          create_host_path: false

  # compose 안의 runner 는 기본 기동에서 뺍니다(같은 실행 폴더를 두 실행기가 쓰지 않도록).
  runner:
    profiles: ["in-compose-runner"]
