# libertree-delivery v2: 같은 DB, 이미지 교체 번들
#
# 운영 중인 기존 compose 프로젝트 `libertree-delivery` 의 postgres(컨테이너·볼륨·포트)는
# 그대로 두고, 이 브랜치에서 빌드한 be/fe/worker/file-worker/runner 를 **별도 프로젝트**
# (기본 libertree-delivery-v2)로 띄워 기존 postgres 에 붙입니다.
#
# 기존 postgres 에 붙는 방식: 기존 프로젝트의 네트워크(PROD_DB_NETWORK, 기본
# libertree-delivery_default)를 `external` 로 참조하고 컨테이너 이름(PROD_DB_HOST, 기본
# libertree-delivery-postgres-1)으로 접속합니다. 이 파일에는 postgres 서비스도 pgdata 볼륨도
# 없으므로, 이 프로젝트의 어떤 compose 명령도 기존 postgres 컨테이너를 만들거나 다시 만들거나
# 지울 수 없습니다. (같은 프로젝트 이름 + external 볼륨 방식은 쓰지 않습니다: 같은 이름의
# be/fe 서비스가 기존 컨테이너를 재생성·삭제하고 --remove-orphans 가 postgres 를 지울 수 있음.)
#
# 이 디렉터리에서 실행합니다(.env 도 여기). 순서 요약, 전체는 ADMIN_GUIDE.md:
#   migrate/00_preflight.sh                  # 필수: 운영 컨테이너 ID·이미지 ID 기록
#   docker compose --profile tools build     # 새 이미지(새 접두사·태그, 기존 이미지 보존)
#   migrate/01_dump.sh <운영 postgres> <백업>  # 변경 전 백업
#   migrate/03_cutover.sh                    # 기존 앱 정지(기록) → migrate → blob 게이트 → v2 기동
#   migrate/04_rollback.sh                   # 되돌리기: v2 정지 → 기록한 기존 컨테이너 시작
#
# 이미지는 저장소의 기존 Dockerfile(delivery/Dockerfile.*)을 그대로 빌드합니다(context ../..).
# 번들 밖에 두는 것: 기존 postgres, nginx-blob(8181), cloudflare-ddns.
name: ${COMPOSE_PROJECT_NAME:-libertree-delivery-v2}

x-pg-dsn: &pg-dsn postgresql://${POSTGRES_USER:-libertree}:${POSTGRES_PASSWORD:-}@${PROD_DB_HOST:-libertree-delivery-postgres-1}:5432/${POSTGRES_DB:-libertree}

# 기존 운영 blob 디렉터리(운영 DB 의 seq_id 기반 파일). 필수. be는 읽기 전용.
x-blob-ro: &blob-ro
  type: bind
  source: ${BLOB_HOST_PATH:?set BLOB_HOST_PATH in .env to the existing blob directory}
  target: /data/blob
  read_only: true
  bind:
    create_host_path: false
x-blob-rw: &blob-rw
  type: bind
  source: ${BLOB_HOST_PATH:?set BLOB_HOST_PATH in .env to the existing blob directory}
  target: /data/blob
  bind:
    create_host_path: false

x-logging: &delivery-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-site-keys: &site-keys
  CANCER_FR_CATALOGUE_DES_PUBLIC_KEY: ${CANCER_FR_CATALOGUE_DES_PUBLIC_KEY:-}
  EDUCATION_GOVT_NZ_OUR_WORK_KEY: ${EDUCATION_GOVT_NZ_OUR_WORK_KEY:-}
  EDUCATION_GOVT_NZ_SEARCH_KEY: ${EDUCATION_GOVT_NZ_SEARCH_KEY:-}
  INRAE_FR_ACTUALITES_KEY: ${INRAE_FR_ACTUALITES_KEY:-}
  NKVTS_NO_ENGLISH_KEY: ${NKVTS_NO_ENGLISH_KEY:-}
  PHFSCIENCE_NZ_DIGITAL_LIBRARY_KEY: ${PHFSCIENCE_NZ_DIGITAL_LIBRARY_KEY:-}
  PHFSCIENCE_NZ_NEWS_PUBLICATIONS_KEY: ${PHFSCIENCE_NZ_NEWS_PUBLICATIONS_KEY:-}
  TRANSPARENCY_GOV_AU_PUBLICATIONS_KEY: ${TRANSPARENCY_GOV_AU_PUBLICATIONS_KEY:-}
  SCIENCEON_KEY: ${SCIENCEON_KEY:-}
  SCIENCEON_CLIENT_ID: ${SCIENCEON_CLIENT_ID:-}
  SCIENCEON_MAC_ADDRESS: ${SCIENCEON_MAC_ADDRESS:-}

services:
  # POSTGRES_PASSWORD가 비어 있으면 be/worker가 알 수 없는 인증 오류로 죽기 전에
  # 원인을 이름으로 알려 주고 실패합니다(delivery/docker-compose.yml과 동일).
  postgres-password-guard:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -z "$$POSTGRES_PASSWORD" ]; then
          echo "POSTGRES_PASSWORD is not set. migrate/be/worker cannot authenticate to postgres." >&2
          echo "Set POSTGRES_PASSWORD in deploy/delivery-bundle/.env -- see ADMIN_GUIDE.md." >&2
          exit 1
        fi
    restart: "no"

  # 1회성 스키마 마이그레이션(추가형, 기존 행을 지우지 않음). 기본 `up`에는
  # 포함되지 않습니다:  docker compose run --rm migrate
  migrate:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: delivery/Dockerfile.be
    image: ${IMAGE_PREFIX:-libertree-delivery-v2}-be:${IMAGE_TAG:?set IMAGE_TAG in .env (e.g. 20261020)}
    command: ["python", "-m", "delivery.be.migrate"]
    environment:
      LIBERTREE_PG_DSN: *pg-dsn
    networks: [proddb]
    depends_on:
      postgres-password-guard:
        condition: service_completed_successfully
    restart: "no"

  be:
    build:
      context: ../..
      dockerfile: delivery/Dockerfile.be
    image: ${IMAGE_PREFIX:-libertree-delivery-v2}-be:${IMAGE_TAG:?set IMAGE_TAG in .env (e.g. 20261020)}
    environment:
      <<: *site-keys
      LIBERTREE_PG_DSN: *pg-dsn
      LIBERTREE_DB_BACKEND: postgres
      LIBERTREE_BLOB_ROOT: /data/blob
      DELIVERY_AUTH_MODE: ${DELIVERY_AUTH_MODE:-token}
      DELIVERY_API_TOKEN: ${DELIVERY_API_TOKEN:-}
      DELIVERY_DB_POOL_MIN: ${DELIVERY_DB_POOL_MIN:-1}
      DELIVERY_DB_POOL_MAX: ${DELIVERY_DB_POOL_MAX:-10}
      DELIVERY_AGGREGATE_CACHE_SECONDS: ${DELIVERY_AGGREGATE_CACHE_SECONDS:-30}
      CRAWLER_HEALTH_REPORT_DIR: /data/health
      CRAWLER_HEALTH_STALE_HOURS: ${CRAWLER_HEALTH_STALE_HOURS:-48}
      TRANSLATION_INTERNAL_MODEL: ${TRANSLATION_INTERNAL_MODEL:-}
      TRANSLATION_EXTERNAL_MODEL: ${TRANSLATION_EXTERNAL_MODEL:-}
      # /collect API → 같은 compose 네트워크의 runner 서비스.
      COLLECT_RUNNER_URL: ${COLLECT_RUNNER_URL:-http://runner:8793}
      # 비워 두면 아래 토큰 파일(COLLECT_RUNNER_HOME/.token, 기동 전에 관리자가 만듦)을 읽습니다.
      COLLECT_RUNNER_TOKEN: ${COLLECT_RUNNER_TOKEN:-}
      COLLECT_RUNNER_TOKEN_FILE: /run/collect-runner/.token
      COLLECT_RUNNER_CACHE_SECONDS: ${COLLECT_RUNNER_CACHE_SECONDS:-3}
      # 사이트 상태 CSV 폴더. docker-compose.collect-status.yml을 함께 쓸 때만 채워집니다.
      COLLECT_STATUS_DIR: ${COLLECT_STATUS_DIR:-}
    # host.docker.internal → 호스트 게이트웨이 (Docker 20.10 이상 필요).
    extra_hosts: ["host.docker.internal:host-gateway"]
    # default: fe·runner 와 통신, proddb: 기존 postgres 접속
    networks: [default, proddb]
    volumes:
      - *blob-ro
      - health-reports:/data/health:ro
      # runner 토큰 파일 하나만 읽기 전용으로 붙입니다(필수). 파일이 없으면 be가 기동하지
      # 않습니다(Docker가 빈 디렉터리를 대신 만들지 않도록 create_host_path: false).
      # 기동 전에 ADMIN_GUIDE.md 1장대로 COLLECT_RUNNER_HOME/.token 을 만들어 두십시오.
      # runner는 .token 이 이미 있으면 그대로 씁니다. be는 컨테이너 root라 0600 파일을 읽습니다.
      - type: bind
        source: ${COLLECT_RUNNER_HOME:-/srv/collect-runner-v2}/.token
        target: /run/collect-runner/.token
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${BE_PORT:-8080}:3001"
    depends_on:
      postgres-password-guard:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *delivery-logging

  fe:
    build:
      context: ../..
      dockerfile: delivery/Dockerfile.fe
    image: ${IMAGE_PREFIX:-libertree-delivery-v2}-fe:${IMAGE_TAG:?set IMAGE_TAG in .env (e.g. 20261020)}
    environment:
      BE_URL: http://be:3001
      DELIVERY_API_TOKEN: ${DELIVERY_API_TOKEN:-}
      TRANSLATION_INTERNAL_MODEL: ${TRANSLATION_INTERNAL_MODEL:-}
    ports:
      # 기본 127.0.0.1. FE는 로그인 없이 운영자 권한(DELIVERY_API_TOKEN)으로 BE를 호출하므로
      # 외부 공개는 인증하는 리버스 프록시/IP 허용 목록 뒤에서만(ADMIN_GUIDE.md 7장).
      - "${FE_BIND:-127.0.0.1}:${FE_PORT:-3000}:3002"
    depends_on:
      be:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3002/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *delivery-logging

  worker:
    build:
      context: ../..
      dockerfile: delivery/Dockerfile.worker
    image: ${IMAGE_PREFIX:-libertree-delivery-v2}-worker:${IMAGE_TAG:?set IMAGE_TAG in .env (e.g. 20261020)}
    environment:
      <<: *site-keys
      LIBERTREE_PG_DSN: *pg-dsn
      LIBERTREE_DB_BACKEND: postgres
      LIBERTREE_BLOB_ROOT: /data/blob
      TRANSLATION_EXTERNAL_ENDPOINT: ${TRANSLATION_EXTERNAL_ENDPOINT:-}
      TRANSLATION_EXTERNAL_MODEL: ${TRANSLATION_EXTERNAL_MODEL:-}
      TRANSLATION_EXTERNAL_API_KEY: ${TRANSLATION_EXTERNAL_API_KEY:-}
      TRANSLATION_INTERNAL_ENDPOINT: ${TRANSLATION_INTERNAL_ENDPOINT:-}
      TRANSLATION_INTERNAL_MODEL: ${TRANSLATION_INTERNAL_MODEL:-}
      TRANSLATION_WORKER_ID: ${TRANSLATION_WORKER_ID:-delivery-worker-1}
      LIBERTREE_MAX_WALL_S: ${LIBERTREE_MAX_WALL_S:-1500}
      SCIENCEON_TOKEN_CACHE: ${SCIENCEON_TOKEN_CACHE:-/data/runtime/scienceon_token.json}
      SCIENCEON_SLICE_BUDGET: ${SCIENCEON_SLICE_BUDGET:-4}
      SCIENCEON_INCREMENTAL_YEARS: ${SCIENCEON_INCREMENTAL_YEARS:-2}
      SCIENCEON_INCREMENTAL_PAGES: ${SCIENCEON_INCREMENTAL_PAGES:-3}
    networks: [proddb]
    volumes:
      - *blob-rw
      - runtime:/data/runtime
    depends_on:
      postgres-password-guard:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "delivery.health.worker_check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *delivery-logging

  file-worker:
    build:
      context: ../..
      dockerfile: delivery/Dockerfile.worker
    image: ${IMAGE_PREFIX:-libertree-delivery-v2}-worker:${IMAGE_TAG:?set IMAGE_TAG in .env (e.g. 20261020)}
    command: ["python", "-m", "delivery.files.worker"]
    environment:
      LIBERTREE_PG_DSN: *pg-dsn
      LIBERTREE_DB_BACKEND: postgres
      LIBERTREE_BLOB_ROOT: /data/blob
      FILE_STAGE_TIMEOUT_SECONDS: ${FILE_STAGE_TIMEOUT_SECONDS:-180}
    networks: [proddb]
    volumes:
      - *blob-rw
    depends_on:
      postgres-password-guard:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-m", "delivery.files.check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *delivery-logging

  # 수집 실행기(deploy/collect-runner/runner.py). be가 http://runner:8793 으로 호출.
  #
  # 보안: docker 소켓을 마운트하므로 이 컨테이너는 호스트 root와 같은 권한입니다.
  # 그래서 호스트 포트를 절대 공개하지 않습니다(ports: 없음). 같은 compose
  # 네트워크 안에서만 접근되며 X-Runner-Token을 요구합니다.
  #
  # 경로: run-pilot.sh가 호스트 docker 데몬에 실행 폴더·계획 파일을 bind-mount
  # 시키므로 RUNNER_HOME과 runs root는 호스트와 컨테이너에서 같은 경로여야 합니다.
  # 비root: COLLECT_RUNNER_UID:GID로 실행되고 소켓 그룹(DOCKER_GID)에 들어갑니다.
  # 최초 기동 전에 두 호스트 디렉터리를 만들고 그 uid로 chown 하십시오(ADMIN_GUIDE.md).
  runner:
    build:
      context: ../..
      dockerfile: delivery/Dockerfile.runner
    image: ${IMAGE_PREFIX:-libertree-delivery-v2}-runner:${IMAGE_TAG:?set IMAGE_TAG in .env (e.g. 20261020)}
    user: "${COLLECT_RUNNER_UID:-1000}:${COLLECT_RUNNER_GID:-1000}"
    group_add: ["${DOCKER_GID:-999}"]
    environment:
      RUNNER_HOME: ${COLLECT_RUNNER_HOME:-/srv/collect-runner-v2}
      # 포트를 공개하지 않으므로 컨테이너 안에서 0.0.0.0 바인드가 안전합니다.
      RUNNER_BIND: 0.0.0.0
    volumes:
      - runner-state:${COLLECT_RUNNER_HOME:-/srv/collect-runner-v2}
      - ${COLLECT_RUNS_ROOT:-/srv/enum-pilot-run}:${COLLECT_RUNS_ROOT:-/srv/enum-pilot-run}
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    init: true
    logging: *delivery-logging

networks:
  default:
  # 기존 운영 프로젝트의 네트워크. 참조만 하며 만들거나 지우지 않습니다(없으면 기동 실패).
  proddb:
    external: true
    name: ${PROD_DB_NETWORK:-libertree-delivery_default}

volumes:
  runtime:
  health-reports:
  # COLLECT_RUNNER_HOME 호스트 디렉터리를 같은 경로로 붙이는 named volume.
  # 필수: 디렉터리가 없으면 runner 기동이 실패합니다(먼저 만들고 chown).
  # 기존 운영 runner 상태 폴더와 다른 폴더를 씁니다(기본 /srv/collect-runner-v2).
  # COLLECT_RUNNER_HOME을 바꾸면 runner를 내리고
  # `docker volume rm <프로젝트>_runner-state` 후 다시 올립니다(데이터는 호스트 폴더에 남음).
  runner-state:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${COLLECT_RUNNER_HOME:-/srv/collect-runner-v2}
