# 선택: postgres를 호스트 포트로 공개합니다(기본은 미공개).
# 사용: .env에 COMPOSE_FILE=docker-compose.yml:docker-compose.pg-port.yml 추가
#       또는 docker compose -f docker-compose.yml -f docker-compose.pg-port.yml ...
# 기본 바인드는 127.0.0.1입니다. 현재 운영처럼 53232를 유지하려면
#   POSTGRES_HOST_PORT=53232 (POSTGRES_BIND=127.0.0.1 권장)
# 0.0.0.0으로 공개하지 마십시오(ADMIN_GUIDE.md 보안 참고).
services:
  postgres:
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-53232}:5432"
